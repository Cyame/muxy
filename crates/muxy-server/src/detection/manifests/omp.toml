id = "omp"
version = "2026.10.12.1"
min_engine_version = 1
updated_at = "2026-10-12T00:00:00Z"
aliases = ["oh-my-pi"]

[[rules]]
id = "working_row"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*⎋ \S.*$']

[[rules]]
id = "headless_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(1)"
visible_working = true
line_regex = ['^\s*Working\.\.\.\s*$']

[[rules]]
id = "legacy_working_row"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working… \[esc\]\s*$']

[[rules]]
id = "status_line_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] \d+[smh] · ']

[[rules]]
id = "approval_footer"
state = "blocked"
priority = 200
region = "whole_recent"
contains = ["to navigate, ⏎ to select, ⎋ to deny"]

[[rules]]
id = "status_line_idle"
state = "idle"
priority = 90
region = "bottom_non_empty_lines(12)"
visible_idle = true
line_regex = ['^\s*π · ']
